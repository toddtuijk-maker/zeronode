name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck bash

      - name: Bash syntax check
        run: |
          set -e
          find . -type f \( -name '*.sh' -o -name 'zn' -o -name 'zn-daemon' -o -name 'install.sh' \) \
            ! -path './vendor/*' ! -path './.git/*' -print0 | xargs -0 -n1 bash -n

      - name: ShellCheck
        run: |
          set -e
          while IFS= read -r f; do
            shellcheck -S warning -x "$f"
          done < <(find . -type f \( -name '*.sh' -o -name 'zn' -o -name 'zn-daemon' -o -name 'install.sh' \) \
            ! -path './vendor/*' ! -path './.git/*')

      - name: Run tests
        run: bash tests/run_tests.sh
